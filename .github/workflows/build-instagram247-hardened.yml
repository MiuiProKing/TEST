name: Build Instagram 24-7 AUTOPAIR

on:
  workflow_dispatch:
  push:
    paths:
      - "instagram247/**"
      - ".github/workflows/build-instagram247-hardened.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Generate private AUTOPAIR key
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import secrets

          marker = "__IG247_AUTOPAIR_SECRET__"
          secret = secrets.token_hex(32)
          paths = [
              Path("instagram247/Instagram24_Server_HARDENED_PAIRED.py"),
              Path("instagram247/Instagram247App/OneWinClock/ViewController.swift"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if text.count(marker) != 1:
                  raise RuntimeError(f"Unexpected AUTOPAIR marker count in {path}")
              path.write_text(text.replace(marker, secret), encoding="utf-8")
          PY
          python3 -m py_compile instagram247/Instagram24_Server_HARDENED_PAIRED.py
          if grep -R -n "__IG247_AUTOPAIR_SECRET__" instagram247; then
            echo "AUTOPAIR marker was not replaced"
            exit 1
          fi

      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild \
            -project instagram247/Instagram247App/OneWinClock.xcodeproj \
            -scheme OneWinClock \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/Instagram247Derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package and verify unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Instagram247Derived/Build/Products/Release-iphoneos/OneWinClock.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/package/Payload" dist
          cp -R "$APP" "$RUNNER_TEMP/package/Payload/Instagram247.app"
          cp instagram247/Instagram24_Server_HARDENED_PAIRED.py dist/Instagram24_Server_AUTOPAIR.py
          cp instagram247/Instagram24_HARDENED_README_RU.txt dist/Instagram24_AUTOPAIR_README_RU.txt
          (
            cd "$RUNNER_TEMP/package"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/Instagram-24-7-AUTOPAIR-unsigned.ipa" Payload
          )
          /usr/bin/plutil -p "$APP/Info.plist"
          /usr/bin/file "$APP/OneWinClock"
          if /usr/bin/codesign -d "$APP" >/dev/null 2>&1; then
            echo "Expected an unsigned app, but a signature was found"
            exit 1
          fi
          unzip -t dist/Instagram-24-7-AUTOPAIR-unsigned.ipa

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Instagram-24-7-AUTOPAIR
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/Instagram-24-7-AUTOPAIR-unsigned.ipa
            dist/Instagram24_Server_AUTOPAIR.py
            dist/Instagram24_AUTOPAIR_README_RU.txt
