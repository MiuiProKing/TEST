name: Verify VIP backend reconstruction
on:
  push:
    paths:
      - 'vip-backend-reconstruction/**'
      - '.github/workflows/vip-backend-reconstruction.yml'
  pull_request:
    paths:
      - 'vip-backend-reconstruction/**'
      - '.github/workflows/vip-backend-reconstruction.yml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check syntax and contracts
        working-directory: vip-backend-reconstruction
        run: |
          for file in *.mjs vendor/*.mjs; do
            node --check "$file"
          done
          npm test
