name: Build Neon Audio Mod

on:
  push:
    branches:
      - build-neon-audio-modpack-20260816
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS arm64 dylib
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK" \
            -fobjc-arc -fblocks \
            -dynamiclib NeonModesOverlay.m \
            -o NeonModesOverlay.dylib \
            -Wl,-install_name,@rpath/NeonModesOverlay.dylib \
            -framework Foundation -framework UIKit -framework AVFAudio -framework QuartzCore -lobjc
          file NeonModesOverlay.dylib
          xcrun vtool -show-build NeonModesOverlay.dylib || true
      - uses: actions/upload-artifact@v4
        with:
          name: NeonModesOverlay-dylib
          path: NeonModesOverlay.dylib
          if-no-files-found: error
