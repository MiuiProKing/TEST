name: Build Telegram 24/7 unsigned IPA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'telegram247/**'
      - '.github/workflows/build-telegram247-ipa.yml'
  push:
    branches: [main]
    paths:
      - 'telegram247/**'
      - '.github/workflows/build-telegram247-ipa.yml'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate private paired credentials
        run: |
          set -euo pipefail
          export CMD_TOPIC="tg247-cmd-$(openssl rand -hex 24)"
          export EVT_TOPIC="tg247-evt-$(openssl rand -hex 24)"
          export PAIR_SECRET="$(openssl rand -hex 32)"
          python3 - <<'PY'
          from pathlib import Path
          import os
          pairs = {
              '__TG247_CMD_TOPIC__': os.environ['CMD_TOPIC'],
              '__TG247_EVT_TOPIC__': os.environ['EVT_TOPIC'],
              '__TG247_PAIR_SECRET__': os.environ['PAIR_SECRET'],
          }
          targets = [
              Path('telegram247/Telegram247App/OneWinClock/ViewController.swift'),
              Path('telegram247/Telegram24_Server.py'),
          ]
          for path in targets:
              text = path.read_text(encoding='utf-8')
              for old, new in pairs.items():
                  count = text.count(old)
                  if count < 1:
                      raise SystemExit(f'{old} not found in {path}')
                  text = text.replace(old, new)
              if '__TG247_' in text:
                  raise SystemExit(f'unresolved placeholder in {path}')
              path.write_text(text, encoding='utf-8')
          Path('Telegram24_Server_PAIRED.py').write_text(
              Path('telegram247/Telegram24_Server.py').read_text(encoding='utf-8'), encoding='utf-8'
          )
          PY

      - name: Validate server source
        run: python3 -m py_compile Telegram24_Server_PAIRED.py

      - name: Xcode info
        run: |
          xcodebuild -version
          xcodebuild -project telegram247/Telegram247App/OneWinClock.xcodeproj -list

      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/Telegram247Build"
          xcodebuild \
            -project telegram247/Telegram247App/OneWinClock.xcodeproj \
            -scheme OneWinClock \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH="$BUILD_DIR/Build/Products/Release-iphoneos/OneWinClock.app"
          test -d "$APP_PATH"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Telegram-24-7-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/Telegram-24-7-unsigned.ipa"
          ls -lh "$GITHUB_WORKSPACE/Telegram-24-7-unsigned.ipa"

      - name: Upload private paired package
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-24-7-secure-pair
          path: |
            Telegram-24-7-unsigned.ipa
            Telegram24_Server_PAIRED.py
            telegram247/README_RU.txt
          if-no-files-found: error
          retention-days: 30
